---
- name: Check clickhouse config, data and logs
  file:
    dest: "{{ item }}"
    owner: "{{ clickhouse_user | default('clickhouse') }}"
    group: "{{ clickhouse_group | default('clickhouse') }}"
    mode: "ug=rwx,o-rwx"
    state: directory
  loop:
    - "{{ clickhouse_path_logdir }}"
    - "{{ clickhouse_path_configdir }}"
    - "{{ clickhouse_keeper_path_configdir }}"
    - "{{ clickhouse_path_tmp }}"
    - "{{ clickhouse_path_data }}"
    - "{{ clickhouse_access_control_path }}"
    - "{{ clickhouse_path_chk }}"
    - "{{ clickhouse_path_chk_snap }}"
    - "{{ clickhouse_path_chk_log }}"
  notify: restart-ch
  become: true

- name: Config | Certs file ownership, group and permissions
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ clickhouse_user | default('clickhouse') }}"
    group: "{{ clickhouse_group | default('clickhouse') }}"
    mode: "u=r,og=r"
  loop:
    - "{{ clickhouse_ssl_server.certificate_file }}"
    - "{{ clickhouse_ssl_server.private_key_file }}"
    - "{{ clickhouse_ssl_server.dh_params_file | default('') }}"
  when: item | length > 0
  notify: restart-ch
  become: true

- name: Config | Create keeper config.d folder
  file:
    path: "{{ clickhouse_keeper_path_configdir }}/config.d"
    state: directory
    owner: "{{ clickhouse_user | default('clickhouse') }}"
    group: "{{ clickhouse_group | default('clickhouse') }}"
    mode: "ug=rwx,o-rwx"
  become: true

- name: Config | Create config.d folder
  file:
    path: "{{ clickhouse_path_configdir }}/config.d"
    state: directory
    owner: "{{ clickhouse_user | default('clickhouse') }}"
    group: "{{ clickhouse_group | default('clickhouse') }}"
    mode: "ug=rwx,o-rwx"
  become: true

- name: Config | Create users.d folder
  file:
    path: "{{ clickhouse_path_configdir }}/users.d"
    state: directory
    owner: "{{ clickhouse_user | default('clickhouse') }}"
    group: "{{ clickhouse_group | default('clickhouse') }}"
    mode: "ug=rwx,o-rwx"
  become: true

- name: Config | Generate system config
  template:
    src: config.j2
    dest: "{{ clickhouse_path_configdir }}/config.xml"
    owner: "{{ clickhouse_user | default('clickhouse') }}"
    group: "{{ clickhouse_group | default('clickhouse') }}"
    mode: "ug=rw,o-rwx"
  notify: restart-ch
  become: true

- name: Config | Generate users config
  template:
    src: users.j2
    dest: "{{ clickhouse_path_configdir }}/users.d/users.xml"
    owner: "{{ clickhouse_user | default('clickhouse') }}"
    group: "{{ clickhouse_group | default('clickhouse') }}"
    mode: "ug=rw,o-rwx"
  notify: restart-ch
  become: true

- name: Config | Generate Clickhouse Keeper servers config
  template:
    src: clickhousekeeper-servers.j2
    dest: "{{ clickhouse_keeper_path_configdir }}/config.d/clickhousekeeper-servers.xml"
    owner: "{{ clickhouse_user | default('clickhouse') }}"
    group: "{{ clickhouse_group | default('clickhouse') }}"
    mode: "u=rw,og=r"
  notify: restart-ch
  become: true
  when: (clickhousekeeper_nodes is defined) and (clickhousekeeper_nodes | selectattr('id', '==', clickhouse_keeper_id))

- name: Config | Generate storage config
  template:
    src: storage.j2
    dest: "{{ clickhouse_path_configdir }}/config.d/storage.xml"
    owner: "{{ clickhouse_user | default('clickhouse') }}"
    group: "{{ clickhouse_group | default('clickhouse') }}"
    mode: "u=rw,og=r"
  notify: restart-ch
  become: true
  when: clickhouse_storage is defined

- set_fact:
    __clickhouse_named_collections:
      clickhouse:
        named_collections: "{{ clickhouse_named_collections }}"
  when: clickhouse_named_collections is defined

- name: Config | Generate named_collections config
  template:
    src: named_collections.j2
    dest: "{{ clickhouse_path_configdir }}/config.d/named_collections.xml"
    owner: "{{ clickhouse_user | default('clickhouse') }}"
    group: "{{ clickhouse_group | default('clickhouse') }}"
    mode: "u=rw,og=r"
  notify: restart-ch
  become: true
  when: __clickhouse_named_collections is defined

- name: Config | Fix interserver_http_port and intersever_https_port collision
  lineinfile:
    path: "{{ clickhouse_path_configdir }}/config.xml"
    search_string: '<interserver_http_port>'
    state: absent
  become: true
  notify: restart-ch
  when: clickhouse_interserver_https is defined
