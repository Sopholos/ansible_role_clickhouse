---
# handlers file for clickhouse
- name: Looking for preprocessed configs in {{ clickhouse_path_configdir }}
  ansible.builtin.find:
    paths: "{{ clickhouse_path_configdir }}"
    patterns: "*preprocessed*.xml"
    recurse: yes
  register: files_to_remove
  listen: 'restart-ch'

- name: Remove found files in {{ clickhouse_path_configdir }}
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ files_to_remove.files }}"
  listen: 'restart-ch'

- name: Looking for preprocessed configs in {{ clickhouse_keeper_path_configdir }}
  ansible.builtin.find:
    paths: "{{ clickhouse_keeper_path_configdir }}"
    patterns: "*preprocessed*.xml"
    recurse: yes
  register: files_to_remove
  listen: 'restart-ch'

- name: Remove found files in {{ clickhouse_keeper_path_configdir }}
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ files_to_remove.files }}"
  listen: 'restart-ch'
  when: clickhouse_keeper_service_enable

- name: "Restart Clickhouse Service"
  set_fact:
    clickhouse_service_ensure: "restarted"
  listen: 'restart-ch'
  when: clickhouse_service_enable

- name: "Restart Clickhouse Keeper Service"
  set_fact:
    clickhouse_keeper_service_ensure: "restarted"
  listen: 'restart-ch'
  when: clickhouse_keeper_service_enable

- name: >-
    Ensure {{ clickhouse_keeper_service }}
    is enabled: {{ clickhouse_keeper_service_enable }}
    and state: {{ clickhouse_keeper_service_ensure }}
  systemd:
    name: "{{ clickhouse_keeper_service }}"
    enabled: "{{ clickhouse_keeper_service_enable }}"
    state: "{{ clickhouse_keeper_service_ensure }}"
    daemon_reload: true
  become: true
  listen: 'restart-ch'

- name: >-
    Ensure {{ clickhouse_service }}
    is enabled: {{ clickhouse_service_enable }}
    and state: {{ clickhouse_service_ensure }}
  systemd:
    name: "{{ clickhouse_service }}"
    enabled: "{{ clickhouse_service_enable }}"
    state: "{{ clickhouse_service_ensure }}"
    daemon_reload: true
  become: true
  listen: 'restart-ch'
